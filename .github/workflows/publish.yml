name: Publish to npm

# Publishes @unimodular/unimod-sdk when a GitHub Release is published.
# Auth is via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret stored.
#
# Hardened: third-party actions pinned to commit SHAs, npm pinned, permissions
# scoped to the job that needs them. (The human reviewer gate was removed in favour
# of fully-automatic publishing — see auto-release.yml for the contract-driven path.)
#
# Prereqs (one-time): the package must already exist on npm (first publish was
# manual), and this repo+workflow is registered as a Trusted Publisher under the
# package settings on npmjs.com.

on:
  release:
    types: [published]
  workflow_dispatch: {} # manual runs from the Actions tab (still gated by the environment)

# No workflow-wide permissions; grant the minimum only at the job that needs it.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the short-lived OIDC token npm verifies — scoped to this job only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Short-lived token from the org GitHub App — `npm run build` runs the codegen
      # (scripts/sync-contracts.sh) which clones unimod @ contracts.ref over HTTPS.
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: unimodularxyz
          repositories: unimod
      - name: Configure contracts clone URL
        run: echo "CONTRACTS_REPO=https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/unimodularxyz/unimod.git" >> "$GITHUB_ENV"

      # Foundry (forge) — the codegen compiles the contracts before wagmi reads the artifacts.
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing + provenance need npm >= 11.5.1; pin it (don't track @latest).
      - run: npm install -g npm@11.6.4

      - run: npm ci
      - run: npm run build # codegen (sync + forge build + wagmi) then tsc — ABIs baked into dist/

      # No token needed: npm detects the OIDC credential from id-token:write.
      # --provenance attaches a signed build attestation (repo is public); access:public is in package.json.
      - run: npm publish --provenance --access public
