name: CI

# Verify the SDK builds against the pinned contracts on every push / PR.
# Regenerates generated.ts from unimod @ contracts.ref, typechecks, builds. This is the
# anti-drift gate: if a contract change breaks the SDK, tsc fails here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Short-lived token from the org GitHub App to read the private contracts repo.
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: unimodularxyz
          repositories: unimod
      - name: Configure contracts clone URL (codegen clones unimod via the App token)
        run: echo "CONTRACTS_REPO=https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/unimodularxyz/unimod.git" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
