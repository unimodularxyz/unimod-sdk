name: Auto-release on contract change

# Fully-automatic path: when the contracts repo (unimod) changes on main, it fires a
# repository_dispatch here. We re-pin contracts.ref to the new SHA, regenerate the ABIs,
# bump the patch version, publish to npm via OIDC, and push the bump back. Zero clicks.
#
# The version bump is committed BEFORE publishing, so the published package is self-consistent
# even if the push-back is blocked by branch protection (publish still succeeds).
on:
  repository_dispatch:
    types: [contracts-updated]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit + push the version / contracts.ref bump
      id-token: write # OIDC token npm verifies — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Short-lived token from the org GitHub App to read the private contracts repo.
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: unimodularxyz
          repositories: unimod
      - name: Configure contracts clone URL
        run: echo "CONTRACTS_REPO=https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/unimodularxyz/unimod.git" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11.6.4
      - run: npm ci

      - name: Pin new contracts SHA + commit
        run: |
          git config user.name "unimod-bot"
          git config user.email "bot@unimodular.xyz"
          echo "${{ github.event.client_payload.sha }}" > contracts.ref
          git add contracts.ref
          git commit -m "chore: pin contracts ${{ github.event.client_payload.sha }}" || echo "no contracts.ref change"

      - name: Build (codegen embeds the new ABIs into dist/)
        run: npm run build

      - name: Bump patch version (commits + tags)
        run: |
          npm version patch -m "auto-release: %s (contracts ${{ github.event.client_payload.sha }})"

      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public

      - name: Push bump back (best-effort — publish already succeeded)
        run: |
          git push --follow-tags || echo "push blocked (branch protection); package published anyway"
